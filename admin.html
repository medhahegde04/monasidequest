<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Studio by monasidequest</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <nav id="navbar">
            <a href="index.html" class="nav-logo">M</a>
             <ul class="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#learning">Learning</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>

        <section id="studio">
            <h1 class="fade-in">Studio</h1>
            <p class="hero-intro fade-in">Post something small. It becomes a commit.</p>


            <div class="learning-card" id="view-login">
                <p class="projects-eyebrow">Passphrase</p>
                <input id="pass" type="password" autocomplete="current-password">
                <div class="filter-bar">
                    <button class="btn" id="btn-login">Unlock</button>
                </div>
                <div class="projects-empty" id="msg-login"></div>
            </div>


            <div class="learning-card hidden" id="view-compose">
                <p class="projects-eyebrow">Picture</p>
                <div class="filter-bar">
                    <button class="filter-btn" id="btn-pick">Choose / Take a Photo</button>
                </div>
                <input id="file" type="file" accept="image/*" class="hidden">
                <div class="projects-empty" id="pick-status"></div>

                <p class="projects-eyebrow">Title</p>
                <input id="title" type="text" maxlength="80">

                <p class="projects-eyebrow">Tag</p>
                <input id="tag" type="text" maxlength="30" placeholder="sketch, note, craft...">

                <p class="projects-eyebrow">Caption / Note</p>
                <textarea id="caption" maxlength="600"></textarea>

                <div class="filter-bar">
                    <button class="filter-btn" id="btn-lock">Lock</button>
                    <button class="btn" id="btn-preview">Preview</button>
                </div>
                <div class="projects-empty" id="msg-compose"></div>
            </div>


            <div class="hidden" id="view-preview">
                <p class="projects-eyebrow">This will appear on your site.</p>
                <div class="creative-grid" id="preview-card"></div>

                <div class="learning-card" style="margin-top: 1.5rem;">
                    <p class="projects-eyebrow">Files that will change:</p>
                    <div class="projects-empty" id="files-list"></div>

                    <p class="projects-eyebrow" style="margin-top: 1.1rem;">Commit message:</p>
                    <input id="commit" type="text" maxlength="200">

                    <div class="filter-bar">
                        <button class="filter-btn" id="btn-back">Back</button>
                        <button class="btn" id="btn-publish">Publish</button>
                    </div>
                    <div class="projects-empty" id="msg-preview"></div>
                </div>
            </div>

        </section>

        <footer>
            <p>built by hand · monasidequest</p>
        </footer>

        <script src="script.js"></script>
        <script src="admin.js"></script>
    </body>
</html>
